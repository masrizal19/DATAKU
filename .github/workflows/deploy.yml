name: Deploy DATAKU to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DATAKU
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # NODE.JS 22
      # ==========================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ==========================================
      # CHECK SUPABASE ENVIRONMENT
      # ==========================================
      - name: Check Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL belum tersedia."
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_PUBLISHABLE_KEY belum tersedia."
            exit 1
          fi

          echo "VITE_SUPABASE_URL: SET"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY: SET"

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # BUILD PRODUCTION
      # ==========================================
      - name: Build DATAKU
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # ==========================================
      # VERIFY BUILD
      # ==========================================
      - name: Verify production build
        run: |
          if [ ! -f "./dist/index.html" ]; then
            echo "ERROR: dist/index.html tidak ditemukan."
            exit 1
          fi

          if [ ! -d "./dist/assets" ]; then
            echo "ERROR: dist/assets tidak ditemukan."
            exit 1
          fi

          echo "DATAKU production build berhasil."
          echo "dist/index.html ditemukan."
          echo "dist/assets ditemukan."

      # ==========================================
      # CUSTOM DOMAIN
      # ==========================================
      - name: Configure DATAKU custom domain
        run: |
          echo "dataku.mkverse.my.id" > ./dist/CNAME

          echo "Custom domain:"
          cat ./dist/CNAME

      # ==========================================
      # GITHUB PAGES
      # ==========================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ============================================
  # DEPLOY
  # ============================================
  deploy:
    name: Deploy DATAKU to GitHub Pages

    needs:
      - build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
